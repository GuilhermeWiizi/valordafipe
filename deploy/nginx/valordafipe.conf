# Instale em /etc/nginx/sites-available/valordafipe.com.br.
# Depois do teste HTTP, certbot --nginx -d valordafipe.com.br --redirect habilita HTTPS.
# Cada circuito Blazor (Explorar/Comparar) usa 2 conexões no Nginx (cliente + upstream):
# para ~1000 simultâneos, confira worker_connections >= 4096 em /etc/nginx/nginx.conf.
map $http_upgrade $valordafipe_connection_upgrade {
    default upgrade;
    '' close;
}

# Limite por cliente contra raspagem em massa. Googlebot e Bingbot ficam isentos pelas faixas de IP
# que o deploy/nginx/atualizar-bots-verificados.sh grava (rode-o antes de instalar este arquivo;
# o include do geo não aceita curinga, então o arquivo precisa existir).
geo $valordafipe_isento {
    default 0;
    # 203.0.113.10/32 1;  # outras redes isentas, ex.: a máquina do teste de carga
    include /etc/nginx/valordafipe-bots-verificados.conf;
}

# IPv4 inteiro; IPv6 pelo prefixo /64, que um assinante costuma ter inteiro.
map $remote_addr $valordafipe_cliente {
    "~^(?<prefixo64>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $prefixo64;
    default $remote_addr;
}

# Chave vazia não é contada pelo limit_req/limit_conn.
map $valordafipe_isento $valordafipe_limite {
    1 "";
    default $valordafipe_cliente;
}

# 2 r/s sustentados com rajada de 40: navegação humana não chega perto (arquivos estáticos não
# contam); a aplicação tem um segundo limite, um pouco maior, para quem passar daqui.
limit_req_zone $valordafipe_limite zone=valordafipe_paginas:10m rate=2r/s;
limit_conn_zone $valordafipe_limite zone=valordafipe_circuitos:10m;

server {
    listen 80;
    listen [::]:80;
    server_name valordafipe.com.br;

    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $valordafipe_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # Arquivos estáticos (CSS/JS com fingerprint, _framework, _content, imagens), robots e sitemaps: sem limite.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|txt|xml|webmanifest)$ {
        proxy_pass http://127.0.0.1:8082;
    }

    # Hub do Blazor: cada circuito (Explorar, Comparar e ilhas de coleta) segura uma conexão aberta.
    location /_blazor {
        limit_req zone=valordafipe_paginas burst=40 nodelay;
        limit_conn valordafipe_circuitos 15;
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        limit_req zone=valordafipe_paginas burst=40 nodelay;
        proxy_pass http://127.0.0.1:8082;
    }
}
